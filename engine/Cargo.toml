[package]
name = "tracescope-engine"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Local-first OTLP trace storage with a generational arena and tracing GC"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
wasm-bindgen = "=0.2.129"
js-sys = "0.3"

[profile.release]
lto = true
opt-level = 3
codegen-units = 1

